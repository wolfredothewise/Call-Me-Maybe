[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "function-calling"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "pydantic",
    "llm-sdk",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
exclude = ["llm_sdk"]

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
ignore_errors = true